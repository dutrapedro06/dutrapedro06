name: Gerar gráfico 3D de contribuições

on:
  schedule:
    - cron: "0 4 * * *"   # todo dia, 01h de Brasília
  workflow_dispatch:       # rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar SVGs 3D
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          # Token pessoal (classic) com "repo" e "read:user":
          # é ele que faz os commits dos repositórios privados aparecerem.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Salvar no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "Atualiza gráfico 3D de contribuições"
          git push
