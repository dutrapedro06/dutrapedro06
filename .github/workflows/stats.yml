name: Atualizar estatísticas do perfil

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # todo dia, ~03h de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar cards com dados reais
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}   # token pessoal (repo + read:user)
          GH_USER: ${{ github.repository_owner }}
        run: python profile/gen_stats.py

      - name: Salvar no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/langs.svg profile/heatmap.svg profile/heatmap-3d.svg
          git diff --cached --quiet || git commit -m "Atualiza estatísticas do perfil"
          git push
