<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedro Dutra · Contribuições em 3D</title>
<style>
  :root { --bg:#0a0b10; --panel:#11131b; --border:#23273a; --text:#e6e7ee; --muted:#7d8197; --violet:#a78bfa;
          --cyan:#22d3ee; --green:#4ade80;
          --mono:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace;
          --sans:'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font: 700 12px var(--mono); letter-spacing: 2px; color: var(--violet); margin: 0; }
  .total { font: 13px var(--mono); color: var(--muted); }
  .total b { color: var(--text); }
  .stats { display: flex; gap: 40px; margin: 22px 0 14px; flex-wrap: wrap; }
  .stat i { display: block; width: 18px; height: 3px; border-radius: 2px; margin-bottom: 10px; }
  .stat strong { display: block; font: 800 22px var(--sans); }
  .stat span { font: 12px var(--mono); color: var(--muted); }
  .stage { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 520px; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .tip { position: absolute; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: #1b1f2e;
         border: 1px solid #3b2a6b; font: 12px var(--mono); white-space: nowrap; opacity: 0;
         transform: translate(-50%, calc(-100% - 12px)); transition: opacity .12s; }
  .tip b { color: var(--violet); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
         margin-top: 12px; font: 12px var(--mono); color: var(--muted); }
  button { font: 12px var(--mono); color: var(--text); background: var(--panel); border: 1px solid var(--border);
           border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--violet); }
  a { color: var(--violet); }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">CONTRIBUIÇÕES NO ÚLTIMO ANO · 3D</p>
    <span class="total"><b id="total">–</b> contribuições</span>
  </header>
  <div class="stats">
    <div class="stat"><i style="background:var(--cyan)"></i><strong id="s-active">–</strong><span>dias ativos</span></div>
    <div class="stat"><i style="background:var(--green)"></i><strong id="s-streak">–</strong><span>maior sequência</span></div>
    <div class="stat"><i style="background:var(--violet)"></i><strong id="s-avg">–</strong><span>média por dia ativo</span></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Mapa 3D de contribuições. Arraste para girar."></canvas>
    <div class="tip" id="tip"></div>
  </div>
  <div class="bar">
    <span>arraste para girar · roda do mouse ou pinça para zoom · passe o mouse sobre um dia</span>
    <span><button id="reset">resetar visão</button> <button id="spin">girar sozinho</button></span>
  </div>
  <p class="bar"><a href="https://github.com/dutrapedro06">← voltar ao perfil</a></p>
</main>
<script>
(() => {
  const LEVELS = ["#1b1f2e", "#3b2a6b", "#5b3fb0", "#8b6cf0", "#c4b5fd"];
  const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const tip = document.getElementById("tip");
  const DEFAULT = { yaw: -0.32, pitch: 0.6, zoom: 1.05 };
  let view = { ...DEFAULT }, cells = [], months = [], hovered = null, spin = false, t0 = performance.now();
  let drawn = [];

  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const shade = (h, f) => "rgb(" + rgb(h).map(c => Math.max(0, Math.min(255, Math.round(c * f)))).join(",") + ")";
  const fmtDia = iso => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;

  function build(data) {
    const days = data.days, mx = Math.max(1, ...days.map(d => d[1]));
    const first = new Date(days[0][0] + "T12:00:00");
    let week = 0, lastMonth = null;
    cells = days.map(([day, cnt], i) => {
      const wd = new Date(day + "T12:00:00").getDay();
      if (i > 0 && wd === 0) week++;
      const m = +day.slice(5, 7);
      if (m !== lastMonth && wd === 0) { months.push({ week, label: MESES[m - 1] }); lastMonth = m; }
      const r = Math.sqrt(cnt / mx);
      const lvl = cnt === 0 ? 0 : r <= .2 ? 1 : r <= .4 ? 2 : r <= .65 ? 3 : 4;
      return { day, cnt, week, wd, h: cnt === 0 ? 0.15 : 0.35 + 9 * r, color: LEVELS[lvl] };
    });
    if (months.length > 1 && months[1].week - months[0].week < 3) months.shift();  // evita nov/dez colados
    const weeks = week + 1;
    cells.forEach(c => { c.x = c.week - weeks / 2; c.z = c.wd - 3.5; });

    let best = 0, cur = 0;
    days.forEach(([, c]) => { cur = c ? cur + 1 : 0; best = Math.max(best, cur); });
    const active = days.filter(d => d[1]).length;
    document.getElementById("total").textContent = data.total.toLocaleString("pt-BR");
    document.getElementById("s-active").textContent = active;
    document.getElementById("s-streak").textContent = best + " dias";
    document.getElementById("s-avg").textContent = (data.total / Math.max(active, 1)).toLocaleString("pt-BR", { maximumFractionDigits: 1 });
    requestAnimationFrame(frame);
  }

  // ---------- projeção
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
  }
  function project(x, y, z) {
    const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
    const x1 = x * cy - z * sy, z1 = x * sy + z * cy;           // giro em torno do eixo vertical
    const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;         // inclinação
    const s = Math.min(W / 62, H / 30) * view.zoom;
    return [W / 2 + x1 * s, H * 0.56 - y2 * s, z2];
  }
  const LIGHT = (() => { const v = [-0.4, 1, -0.6], n = Math.hypot(...v); return v.map(a => a / n); })();

  function frame(now) {
    const grow = Math.min(1, (now - t0) / 1400);
    if (spin) view.yaw += 0.004;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // chão
    const n = Math.max(...cells.map(c => c.week)) + 1;
    const floor = [[-n / 2 - .4, -3.9], [n / 2 + .2, -3.9], [n / 2 + .2, 3.7], [-n / 2 - .4, 3.7]].map(([x, z]) => project(x, 0, z));
    ctx.beginPath(); floor.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    ctx.fillStyle = "#0d0f16"; ctx.fill(); ctx.strokeStyle = "#23273a"; ctx.stroke();

    // faces de todos os blocos, ordenadas de trás para frente
    const S = 0.78, blocks = [];
    for (const c of cells) {
      const faces = [];
      const delay = (c.week / n) * 0.55, g = Math.max(0, Math.min(1, (grow - delay) / 0.45));
      const ease = 1 - Math.pow(1 - g, 3);
      const h = c.cnt ? 0.15 + (c.h - 0.15) * ease : c.h;
      const x0 = c.x, x1 = c.x + S, z0 = c.z, z1 = c.z + S;
      const quads = [
        { p: [[x0, h, z0], [x1, h, z0], [x1, h, z1], [x0, h, z1]], n: [0, 1, 0] },
        { p: [[x0, 0, z1], [x1, 0, z1], [x1, h, z1], [x0, h, z1]], n: [0, 0, 1] },
        { p: [[x0, 0, z0], [x1, 0, z0], [x1, h, z0], [x0, h, z0]], n: [0, 0, -1] },
        { p: [[x1, 0, z0], [x1, 0, z1], [x1, h, z1], [x1, h, z0]], n: [1, 0, 0] },
        { p: [[x0, 0, z0], [x0, 0, z1], [x0, h, z1], [x0, h, z0]], n: [-1, 0, 0] },
      ];
      for (const q of quads) {
        const pr = q.p.map(v => project(...v));
        const depth = pr.reduce((a, p) => a + p[2], 0) / 4;
        const lit = 0.45 + 0.55 * Math.max(0, q.n[0] * LIGHT[0] + q.n[1] * LIGHT[1] + q.n[2] * LIGHT[2]);
        faces.push({ pr, depth, cell: c, fill: q.n[1] === 1 ? c.color : shade(c.color, lit * 0.85) });
      }
      faces.sort((a, b) => a.depth - b.depth);   // dentro do bloco: faces de trás primeiro
      blocks.push({ depth: project(c.x + S / 2, c.h / 2, c.z + S / 2)[2], faces });
    }
    // ordem do pintor: blocos mais distantes primeiro (z maior = mais perto)
    blocks.sort((a, b) => a.depth - b.depth);
    drawn = [];
    for (const f of blocks.flatMap(b => b.faces)) {
      ctx.beginPath(); f.pr.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
      const isHover = hovered && f.cell === hovered;
      ctx.fillStyle = isHover ? (f.fill === f.cell.color ? "#ffffff" : "#d9ccff") : f.fill;
      ctx.fill();
      drawn.push(f);
    }

    // meses ao longo da borda da frente
    ctx.font = "11px " + getComputedStyle(document.body).getPropertyValue("--mono");
    ctx.fillStyle = "#7d8197"; ctx.textAlign = "center";
    months.forEach(m => { const [x, y] = project(m.week - n / 2 + .4, 0, 4.6); ctx.fillText(m.label, x, y + 4); });
    [[1, "seg"], [3, "qua"], [5, "sex"]].forEach(([d, l]) => {
      const [x, y] = project(-n / 2 - 1.6, 0, d - 3.5 + .4); ctx.fillText(l, x, y + 4);
    });
    requestAnimationFrame(frame);
  }

  // ---------- interação
  const inside = (px, py, pts) => {
    let ok = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) ok = !ok;
    }
    return ok;
  };
  function pick(px, py) {
    for (let i = drawn.length - 1; i >= 0; i--) if (inside(px, py, drawn[i].pr)) return drawn[i].cell;
    return null;
  }
  function showTip(cell, px, py) {
    hovered = cell;
    if (!cell) { tip.style.opacity = 0; return; }
    const txt = cell.cnt === 0 ? "nenhuma contribuição" : `<b>${cell.cnt}</b> contribuiç${cell.cnt === 1 ? "ão" : "ões"}`;
    tip.innerHTML = `${txt} · ${fmtDia(cell.day)}`;
    tip.style.left = px + "px"; tip.style.top = py + "px"; tip.style.opacity = 1;
  }

  const pointers = new Map();
  let drag = null, pinch = null;
  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (pointers.size === 1) { drag = { x: e.offsetX, y: e.offsetY, yaw: view.yaw, pitch: view.pitch }; canvas.classList.add("dragging"); }
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), zoom: view.zoom }; drag = null; }
    spin = false;
  });
  canvas.addEventListener("pointermove", e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      view.zoom = Math.max(0.5, Math.min(3, pinch.zoom * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d));
      return;
    }
    if (drag) {
      view.yaw = drag.yaw + (e.offsetX - drag.x) * 0.008;
      view.pitch = Math.max(0.08, Math.min(1.5, drag.pitch + (e.offsetY - drag.y) * 0.006));
      showTip(null);
      return;
    }
    showTip(pick(e.offsetX, e.offsetY), e.offsetX, e.offsetY);
  });
  const up = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) { drag = null; canvas.classList.remove("dragging"); }
  };
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("pointerleave", () => showTip(null));
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    view.zoom = Math.max(0.5, Math.min(3, view.zoom * Math.exp(-e.deltaY * 0.0015)));
  }, { passive: false });
  document.getElementById("reset").onclick = () => { view = { ...DEFAULT }; spin = false; };
  document.getElementById("spin").onclick = () => { spin = !spin; };
  window.addEventListener("resize", resize);
  resize();

  fetch("data.json", { cache: "no-store" }).then(r => r.json()).then(build)
    .catch(() => { document.getElementById("total").textContent = "?"; });
})();
</script>
</body>
</html>
