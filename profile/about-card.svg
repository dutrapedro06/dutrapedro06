<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img">
<title>Sobre Pedro Dutra</title>
<rect x=".5" y=".5" width="879" height="329" rx="12" fill="#11131b" stroke="#23273a"/>
<path d="M10 24 V10 H24 M856 10 H870 V24 M10 306 V320 H24 M856 320 H870 V306" fill="none" stroke="#23273a" stroke-width="1.5"/>
<defs><clipPath id="c"><rect width="880" height="330" rx="12"/></clipPath>
