<text x="40" y="52" font-family="'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#e6e7ee" text-anchor="start" >Estudante do 6º semestre de Ciência da Computação no IDP e estagiário</text>
<text x="40" y="80" font-family="'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#e6e7ee" text-anchor="start" >em Desenvolvimento de Software no SENAI. Gosto de construir produtos</text>
<text x="40" y="108" font-family="'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#e6e7ee" text-anchor="start" >de ponta a ponta: do app no celular à API e aos dados por trás dele.</text>
